<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>The Last Beacon — Offline Survival Coordinator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%A2%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="rad">☢</span>
      <div><h1>THE LAST BEACON</h1><p>Offline survival coordinator · <span id="cityTag">City #0</span></p></div>
    </div>
    <div class="hud">
      <div class="hud-item"><label>Beacon signal</label><b id="hudBeacon">36.0h</b><div class="bar beacon"><i id="hudBeaconBar"></i></div></div>
      <div class="hud-item"><label>Clock</label><b id="hudClock">15:00</b><small id="hudDay">Daylight</small></div>
      <div class="hud-item"><label>Noise</label><b id="hudNoise">0</b><div class="bar noise"><i id="hudNoiseBar"></i></div></div>
    </div>
    <div class="top-actions">
      <button class="icon" data-act="sound" id="btnSound" title="Sound (on/off)">🔊</button>
      <button class="icon" data-act="help" title="How to play">?</button>
      <button class="icon" data-act="menu" title="Menu">☰</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div id="mapWrap">
        <canvas id="map"></canvas>
        <div id="banner" class="banner hidden"></div>
        <div id="mapTools">
          <button class="chip" data-act="toggleHeat" id="chipHeat">🔥 Threat heat</button>
          <button class="chip on" data-act="toggleVision" id="chipVision">👁 Vision</button>
          <button class="chip on" data-act="toggleRoutes" id="chipRoutes">🧭 Routes</button>
        </div>
        <div id="tooltip" class="hidden"></div>
        <div class="legend">
          <span><i class="dot a"></i>Aarav</span><span><i class="dot m"></i>Mira</span>
          <span><i class="dot h"></i>Horde</span><span><i class="dot g"></i>Beacon</span>
          <span class="muted">Click a building icon to set a detour</span>
        </div>
      </div>
      <div class="panel radio">
        <h2>📻 Radio log</h2>
        <div id="log"></div>
      </div>
    </section>

    <aside class="side">
      <div class="panel"><h2>Survivors</h2><div id="survivors"></div></div>
      <div class="panel"><h2>Supplies</h2><div id="supplies"></div></div>
      <div class="panel"><h2>Route planner <small id="routeTarget"></small></h2><div id="routes"></div></div>
      <div class="panel controls">
        <h2>Commands</h2>
        <div class="row">
          <button class="btn primary" data-act="step" id="btnStep">▶ Move (Space)</button>
          <button class="btn" data-act="auto" id="btnAuto">⏵ Auto-run (A)</button>
        </div>
        <div class="seg-label">Pace</div>
        <div class="seg" id="segPace">
          <button data-pace="sneak">Sneak</button><button data-pace="normal">Normal</button><button data-pace="sprint">Sprint</button>
        </div>
        <div class="seg-label">Rations</div>
        <div class="seg" id="segRation">
          <button data-ration="normal">Full</button><button data-ration="half">Half</button>
        </div>
        <div class="row wrap">
          <button class="btn" data-act="scout">🔭 Scout (S)</button>
          <button class="btn" data-act="scavenge" id="btnScav">🔍 Search (E)</button>
          <button class="btn" data-act="rest">🛏 Rest 2h (R)</button>
          <button class="btn" data-act="medkit">⚕ Medkit (M)</button>
          <button class="btn" data-act="resume" id="btnResume">↩ Resume to beacon</button>
        </div>
      </div>
      <div class="panel"><h2>Co-pilot</h2><div id="copilot"></div></div>
      <div class="panel"><h2>Team plan</h2><div id="planboard"></div></div>
      <details class="panel lab">
        <summary>🧪 Threat lab — change the situation</summary>
        <div class="row wrap">
          <button class="btn danger" data-act="surge">🧟 Sudden horde on my route</button>
          <button class="btn" data-act="horde">➕ Hidden horde somewhere</button>
        </div>
        <label class="check"><input type="checkbox" id="chkScripted" checked> Scripted surge after 6 moves</label>
      </details>
    </aside>
  </main>
  <div id="modal" class="modal hidden"></div>
</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/city.js"></script>
<script src="js/planner.js"></script>
<script src="js/game.js"></script>
<script src="js/sound.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
